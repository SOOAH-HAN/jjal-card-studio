<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>짤카드 스튜디오</title><style>
:root{font-family:'DM Sans','Noto Sans KR',system-ui,sans-serif;color:#20282b;background:#f5f5f2;font-synthesis:none;text-rendering:optimizeLegibility;--ink:#20282b;--muted:#778184;--line:#e7e9e6;--mint:#c9f27a;--deep:#183b35;--paper:#fff;--shadow:0 16px 45px #23352b0c}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{background:#fff;border-bottom:1px solid var(--line);padding:0 28px}.header-inner{height:76px;max-width:1440px;margin:auto;display:flex;align-items:center;gap:12px}.brand-mark{width:38px;height:38px;border-radius:13px;background:var(--deep);color:var(--mint);display:grid;place-items:center;font-size:19px;font-weight:800;letter-spacing:-2px}.brand-copy{display:flex;flex-direction:column;gap:1px}.brand-copy h1{font-size:17px;letter-spacing:-.5px;margin:0;font-weight:800}.eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:700;color:#82908a}.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;color:#60706a;font-size:12px}.live-dot{width:7px;height:7px;border-radius:50%;background:#72b94c;box-shadow:0 0 0 3px #72b94c20}main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;max-width:1440px;margin:24px auto;padding:0 28px}.panel{grid-column:2;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);align-self:start}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel-head h2{font-size:16px;letter-spacing:-.3px;margin:0;font-weight:750}.step-pill{font-size:10px;font-weight:700;color:#71807a;background:#f1f4ef;border-radius:20px;padding:6px 9px;letter-spacing:.5px}.group-label{font-size:11px;text-transform:uppercase;letter-spacing:1.15px;color:#87918a;font-weight:800;margin:19px 0 8px}label{display:block;font-size:12px;font-weight:700;color:#46514d;margin:12px 0 6px}input,select,button,textarea{font:inherit;width:100%;border:1px solid #dfe4df;border-radius:9px;background:#fff;color:var(--ink);padding:10px 11px;transition:border-color .18s,box-shadow .18s,transform .18s}input:focus,select:focus,textarea:focus{outline:0;border-color:#7b9b62;box-shadow:0 0 0 3px #c9f27a45}input[type=file]{font-size:11px;padding:8px;background:#fafbf9}input[type=color]{height:40px;padding:4px;cursor:pointer}input[type=range]{accent-color:#557b43;padding:0;border:0;box-shadow:none}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}textarea{resize:vertical;line-height:1.6}button{cursor:pointer;background:#f5f7f3;font-size:12px;font-weight:700;border-color:#e1e6df;margin-top:7px}button:hover{border-color:#bac8b4;transform:translateY(-1px)}button:active{transform:translateY(0)}button.primary{background:var(--deep);color:#fff;border:0;font-weight:750;min-height:46px;font-size:13px;letter-spacing:.1px;box-shadow:0 7px 16px #183b3528}button.primary:hover{background:#24564c}.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px}.section{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}.section h2{font-size:12px;margin:0 0 8px;letter-spacing:.1px}.templates{max-height:110px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}.templates button{text-align:left;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;padding:8px}.stage{grid-column:1;grid-row:1;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:calc(100vh - 124px);background-color:#eceee9;background-image:radial-gradient(#d5d9d1 0.8px,transparent .8px);background-size:17px 17px;border:1px solid #e3e5df;border-radius:20px;padding:54px 32px 32px;overflow:hidden}.preview-toolbar{position:absolute;left:22px;right:22px;top:17px;display:flex;align-items:center;justify-content:space-between;color:#69736e;font-size:11px;font-weight:700}.preview-toolbar span:last-child{background:#fff;border:1px solid #e3e6df;padding:6px 10px;border-radius:20px}canvas{max-width:100%;max-height:calc(100vh - 220px);height:auto;width:auto;object-fit:contain;background:white;box-shadow:0 18px 50px #26362d2b;border-radius:3px}.status{padding:10px 12px;background:#f4f6f1;border:1px solid #eaeee8;border-radius:9px;margin-top:12px;min-height:40px;font-size:11px;color:#58635e;line-height:1.5}.tiny{font-size:12px}.privacy-line{padding:9px 11px;background:#f6f8f4;border-radius:9px;color:#6d7c71;font-size:10px;margin-top:8px;line-height:1.45}.privacy-line strong{color:#3c6a47}@media(max-width:900px){main{grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:0 16px}.panel{padding:17px}.stage{padding:52px 16px 20px}}@media(max-width:700px){header{padding:0 16px}.header-inner{height:66px}main{grid-template-columns:1fr;margin:14px auto;padding:0 12px}.stage{grid-column:1;grid-row:1;min-height:58vh;order:-1}.panel{grid-column:1;grid-row:2}.panel{border-radius:15px}.stage canvas{max-height:55vh}.header-right{font-size:0}.header-right .live-dot{margin-right:6px}}
</style><header><div class="header-inner"><div class="brand-mark" aria-hidden="true">짤</div><div class="brand-copy"><span class="eyebrow">CARD CREATOR</span><h1>짤카드 스튜디오</h1></div><div class="header-right"><span class="live-dot"></span><span>내 기기에서 안전하게 편집 중</span></div></div></header><main><section class="panel"><div class="panel-head"><h2>카드 편집</h2><span class="step-pill">EDIT · 01</span></div><div class="group-label">01  이미지</div><label for="file">이미지 불러오기 (PNG/JPEG)</label><input id="file" type="file" accept="image/png,image/jpeg"><div class="note">지원 형식: PNG, JPEG. 잘못된 파일은 현재 작업을 유지합니다.</div>
<div class="group-label">02  캔버스</div><label for="ratio">화면 비율</label><select id="ratio"><option value="1">1:1</option><option value="0.8">4:5</option><option value="0.5625">9:16</option></select>
<div class="group-label">03  텍스트</div><label for="copy">카드 문구</label><textarea id="copy" rows="3">오늘의 작은 발견</textarea><div class="row"><div><label for="x">가로 위치 (%)</label><input id="x" type="range" min="0" max="100" value="50"></div><div><label for="y">세로 위치 (%)</label><input id="y" type="range" min="0" max="100" value="78"></div></div><div class="row"><div><label for="size">글자 크기</label><input id="size" type="number" min="8" max="240" value="52"></div><div><label for="color">글자 색</label><input id="color" type="color" value="#ffffff"></div></div>
<div class="section"><h2>저장한 템플릿</h2><label for="tname">템플릿 이름</label><input id="tname" placeholder="예: 봄 안내">
<div class="row"><button id="save">현재 설정 저장</button><button id="update">선택 항목 수정</button></div><div class="templates" id="templates"></div><div class="row"><button id="load">불러오기</button><button id="delete">삭제</button></div></div>
<div class="section"><h2>템플릿 백업</h2><button id="exportJson">JSON 내보내기</button><label for="jsonFile">JSON 가져오기</label><input id="jsonFile" type="file" accept="application/json,.json"><div class="note">전체 검증을 통과한 뒤에만 템플릿 목록을 바꿉니다.</div></div>
<button class="primary" id="download">↓　PNG 이미지 저장</button><div class="privacy-line"><strong>✓ 로컬 처리</strong>　선택한 사진은 서버로 업로드되지 않습니다.</div><div id="status" class="status" role="status" aria-live="polite">합성 예시 이미지가 준비되었습니다.</div></section><section class="stage"><div class="preview-toolbar"><span>LIVE PREVIEW</span><span id="ratioBadge">1:1</span></div><canvas id="canvas" width="1000" height="1000" aria-label="이미지 편집 미리보기"></canvas></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');let img=null,selected=-1,templates=JSON.parse(localStorage.getItem('hangul-editor-templates')||'[]');const status=m=>$('status').textContent=m;const safeTemplates=x=>Array.isArray(x)&&x.every(t=>t&&typeof t.id==='string'&&typeof t.name==='string'&&typeof t.text==='string'&&Number.isFinite(t.ratio)&&Number.isFinite(t.size)&&Number.isFinite(t.x)&&Number.isFinite(t.y)&&typeof t.color==='string');function persist(){localStorage.setItem('hangul-editor-templates',JSON.stringify(templates));renderList()}function settings(){return {text:$('copy').value,ratio:Number($('ratio').value),size:Number($('size').value),x:Number($('x').value),y:Number($('y').value),color:$('color').value}}function apply(t){$('copy').value=t.text;$('ratio').value=String(t.ratio);$('size').value=t.size;$('x').value=t.x;$('y').value=t.y;$('color').value=t.color;draw()}
function renderList(){$('templates').replaceChildren(...templates.map((t,i)=>{const b=document.createElement('button');b.textContent=(i===selected?'● ':'')+t.name;b.onclick=()=>{selected=i;$('tname').value=t.name;renderList()};return b}))}
function draw(){const s=settings(),W=1000,H=Math.round(W*s.ratio);c.width=W;c.height=H;const badge=document.getElementById('ratioBadge');if(badge)badge.textContent=s.ratio===1?'1:1':s.ratio===0.8?'4:5':'9:16';ctx.fillStyle='#d4e8df';ctx.fillRect(0,0,W,H);if(img){const scale=Math.max(W/img.width,H/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h)}else{const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#5caa9b');g.addColorStop(1,'#f1bd79');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(W*.72,H*.28,Math.min(W,H)*.16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#286454';ctx.beginPath();ctx.moveTo(0,H*.75);ctx.quadraticCurveTo(W*.25,H*.3,W*.55,H*.72);ctx.quadraticCurveTo(W*.8,H*.32,W,H*.68);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
const px=s.size;ctx.font=`700 ${px}px system-ui, 'Malgun Gothic', sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(0,0,0,.34)';const lines=s.text.split(/\r?\n/);const x=W*s.x/100,y=H*s.y/100,lineH=px*1.25;lines.forEach((line,i)=>ctx.fillText(line,x,y+(i-(lines.length-1)/2)*lineH,W*.9));ctx.fillStyle=s.color;lines.forEach((line,i)=>ctx.fillText(line,x,y+(i-(lines.length-1)/2)*lineH,W*.9))}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg'].includes(f.type)){status('거부됨: PNG 또는 JPEG만 지원합니다. 기존 작업은 유지되었습니다.');e.target.value='';return}const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{img=im;draw();URL.revokeObjectURL(u);status('이미지를 불러왔습니다.')};im.onerror=()=>{URL.revokeObjectURL(u);status('거부됨: 이미지 데이터를 읽을 수 없습니다. 기존 작업은 유지되었습니다.')};im.src=u};['ratio','copy','x','y','size','color'].forEach(id=>$(id).addEventListener('input',draw));
$('save').onclick=()=>{const name=$('tname').value.trim();if(!name){status('템플릿 이름을 입력하세요.');return}templates.push({id:crypto.randomUUID(),name,...settings()});selected=templates.length-1;persist();status('템플릿을 저장했습니다.')};$('update').onclick=()=>{if(selected<0||!templates[selected])return status('수정할 템플릿을 선택하세요.');const name=$('tname').value.trim();if(!name)return status('템플릿 이름을 입력하세요.');templates[selected]={...templates[selected],name,...settings()};persist();status('선택한 템플릿을 수정했습니다.')};$('load').onclick=()=>{if(selected<0||!templates[selected])return status('불러올 템플릿을 선택하세요.');apply(templates[selected]);status('템플릿을 불러왔습니다.')};$('delete').onclick=()=>{if(selected<0||!templates[selected])return status('삭제할 템플릿을 선택하세요.');templates.splice(selected,1);selected=-1;persist();status('템플릿을 삭제했습니다.')};
$('exportJson').onclick=()=>{const b=new Blob([JSON.stringify({version:1,templates},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='templates.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('jsonFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(o.version!==1||!safeTemplates(o.templates))throw Error('필수 항목 또는 형식이 올바르지 않습니다.');templates=o.templates;selected=-1;persist();status('JSON을 검증하고 템플릿을 복원했습니다.')}catch(err){status('JSON 가져오기 거부: '+err.message+' 기존 템플릿은 유지되었습니다.')}finally{e.target.value=''}};
$('download').onclick=()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='finished-'+$('ratio').selectedOptions[0].text.replace(':','x')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png');draw();renderList()})();
</script></html>
